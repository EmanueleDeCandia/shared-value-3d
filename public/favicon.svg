<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07130c"/>
      <stop offset="100%" stop-color="#0f2316"/>
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#fbbf24" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background rounded container for dark/light browser tab contrast -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Roots of the Shared Value Tree -->
  <path d="M32 46 C32 50 26 53 18 55 M32 46 C32 50 38 53 46 55 M32 47 C29 51 27 55 25 58 M32 47 C35 51 37 55 39 58" 
        stroke="#9a6224" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Trunk and Main Branches -->
  <path d="M29 46 C29 36 30 29 23 23 M35 46 C35 36 34 29 41 23 M32 38 L32 19" 
        stroke="url(#trunkGrad)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Foliage Canopy -->
  <circle cx="21" cy="26" r="9" fill="url(#leafGrad2)"/>
  <circle cx="43" cy="26" r="9" fill="url(#leafGrad2)"/>
  <circle cx="26" cy="18" r="10" fill="url(#leafGrad1)"/>
  <circle cx="38" cy="18" r="10" fill="url(#leafGrad1)"/>
  <circle cx="32" cy="12" r="8.5" fill="#86efac"/>

  <!-- Golden Fruits of the Tree -->
  <circle cx="20" cy="25" r="2.5" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="44" cy="25" r="2.5" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="27" cy="17" r="2.2" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="37" cy="17" r="2.2" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="32" cy="10" r="2.2" fill="#fde047" filter="url(#glow)"/>
</svg>
